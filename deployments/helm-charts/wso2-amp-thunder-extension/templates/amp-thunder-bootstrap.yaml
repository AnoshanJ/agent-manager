    ADMIN_ID=$(create_or_get_role "admin" "Full administrative access to all AMP resources")
    set_role_permissions "$ADMIN_ID" "admin" "Full administrative access to all AMP resources" \
      '["amp:org:view","amp:org:modify-settings","amp:org:invite-member","amp:org:remove-member","amp:org:assign-role","amp:org:manage-idp","amp:org:manage-service-account","amp:project:create","amp:project:read","amp:project:update","amp:project:delete","amp:environment:create","amp:environment:read","amp:environment:update","amp:environment:delete","amp:gateway:create","amp:gateway:read","amp:gateway:update","amp:gateway:delete","amp:gateway:token-manage","amp:data-plane:read","amp:deployment-pipeline:create","amp:deployment-pipeline:read","amp:deployment-pipeline:update","amp:deployment-pipeline:delete","amp:git-secret:create","amp:git-secret:read","amp:git-secret:delete","amp:llm-provider-template:create","amp:llm-provider-template:read","amp:llm-provider-template:update","amp:llm-provider-template:delete","amp:llm-provider:create","amp:llm-provider:read","amp:llm-provider:update","amp:llm-provider:delete","amp:llm-provider:configure-guardrail","amp:llm-provider:connect","amp:llm-provider:deploy","amp:llm-provider:api-key-manage","amp:mcp-server:create","amp:mcp-server:read","amp:mcp-server:update","amp:mcp-server:delete","amp:mcp-server:configure-guardrail","amp:mcp-server:connect","amp:mcp-server:api-key-manage","amp:scope:create","amp:scope:read","amp:scope:update","amp:scope:delete","amp:llm-proxy:create","amp:llm-proxy:read","amp:llm-proxy:update","amp:llm-proxy:delete","amp:llm-proxy:deploy","amp:llm-proxy:api-key-manage","amp:evaluator:create","amp:evaluator:read","amp:evaluator:update","amp:evaluator:delete","amp:agent:create","amp:agent:read","amp:agent:update","amp:agent:delete","amp:agent:build","amp:agent:deploy-non-production","amp:agent:deploy-production","amp:agent:promote","amp:agent:rollback","amp:agent:suspend","amp:agent:token-manage","amp:agent:api-key-manage","amp:agent-kind:read","amp:agent-kind:create","amp:agent-kind:update","amp:agent-kind:delete","amp:monitor:create","amp:monitor:read","amp:monitor:update","amp:monitor:delete","amp:monitor:execute","amp:monitor:score-read","amp:monitor:score-publish","amp:observability:trace-read","amp:observability:log-read","amp:observability:build-log-read","amp:observability:metric-read","amp:role:create","amp:role:read","amp:role:update","amp:role:delete","amp:group:create","amp:group:read","amp:group:update","amp:group:delete","amp:agent-identity:read","amp:agent-identity:create","amp:agent-identity:update","amp:agent-identity:delete","amp:catalog:read","amp:repository:read","amp:profile:read","amp:profile:update-attributes"]'

    # ===========================================================================
    # developer — project-scoped development and deployment
    # ===========================================================================
    DEV_ID=$(create_or_get_role "developer" "Development access: build, deploy, and observe agents within projects")
    set_role_permissions "$DEV_ID" "developer" "Development access: build, deploy, and observe agents within projects" \
      '["amp:org:view","amp:project:create","amp:project:read","amp:project:update","amp:project:delete","amp:environment:read","amp:data-plane:read","amp:deployment-pipeline:read","amp:git-secret:create","amp:git-secret:read","amp:git-secret:delete","amp:llm-provider-template:read","amp:llm-provider:read","amp:llm-provider:configure-guardrail","amp:llm-provider:connect","amp:mcp-server:read","amp:mcp-server:configure-guardrail","amp:mcp-server:connect","amp:mcp-server:api-key-manage","amp:scope:read","amp:llm-proxy:create","amp:llm-proxy:read","amp:llm-proxy:update","amp:llm-proxy:delete","amp:llm-proxy:deploy","amp:llm-proxy:api-key-manage","amp:evaluator:read","amp:agent-kind:read","amp:agent:create","amp:agent:read","amp:agent:update","amp:agent:delete","amp:agent:build","amp:agent:deploy-non-production","amp:agent:token-manage","amp:agent:api-key-manage","amp:monitor:create","amp:monitor:read","amp:monitor:update","amp:monitor:delete","amp:monitor:execute","amp:monitor:score-read","amp:observability:trace-read","amp:observability:log-read","amp:observability:build-log-read","amp:observability:metric-read","amp:catalog:read","amp:repository:read","amp:profile:read","amp:profile:update-attributes"]'

    # ===========================================================================
    # ai-lead — AI/ML resources and provider management
    # ===========================================================================
    AILEAD_ID=$(create_or_get_role "ai-lead" "AI lead access: manage LLM providers, MCP servers, and evaluators")
    set_role_permissions "$AILEAD_ID" "ai-lead" "AI lead access: manage LLM providers, MCP servers, and evaluators" \
      '["amp:org:view","amp:project:read","amp:environment:read","amp:data-plane:read","amp:deployment-pipeline:read","amp:llm-provider-template:create","amp:llm-provider-template:read","amp:llm-provider-template:update","amp:llm-provider-template:delete","amp:llm-provider:create","amp:llm-provider:read","amp:llm-provider:update","amp:llm-provider:delete","amp:llm-provider:configure-guardrail","amp:llm-provider:connect","amp:llm-provider:deploy","amp:llm-provider:api-key-manage","amp:mcp-server:create","amp:mcp-server:read","amp:mcp-server:update","amp:mcp-server:delete","amp:mcp-server:configure-guardrail","amp:mcp-server:connect","amp:mcp-server:api-key-manage","amp:scope:create","amp:scope:read","amp:scope:update","amp:scope:delete","amp:evaluator:create","amp:evaluator:read","amp:evaluator:update","amp:evaluator:delete","amp:agent-kind:read","amp:agent:read","amp:agent:build","amp:agent:deploy-non-production","amp:agent:api-key-manage","amp:monitor:read","amp:monitor:score-read","amp:observability:trace-read","amp:observability:metric-read","amp:catalog:read","amp:profile:read","amp:profile:update-attributes"]'

    # ===========================================================================
    # platform-engineer — infrastructure and deployment pipeline management
    # ===========================================================================
    PE_ID=$(create_or_get_role "platform-engineer" "Platform engineering: manage environments, gateways, and agent deployments")
    set_role_permissions "$PE_ID" "platform-engineer" "Platform engineering: manage environments, gateways, and agent deployments" \
      '["amp:org:view","amp:project:read","amp:environment:create","amp:environment:read","amp:environment:update","amp:environment:delete","amp:gateway:create","amp:gateway:read","amp:gateway:update","amp:gateway:delete","amp:gateway:token-manage","amp:data-plane:read","amp:deployment-pipeline:create","amp:deployment-pipeline:read","amp:deployment-pipeline:update","amp:deployment-pipeline:delete","amp:llm-provider:read","amp:llm-provider:configure-guardrail","amp:mcp-server:read","amp:mcp-server:configure-guardrail","amp:scope:read","amp:agent-kind:read","amp:agent:read","amp:agent:build","amp:agent:api-key-manage","amp:agent:deploy-non-production","amp:agent:deploy-production","amp:agent:promote","amp:agent:rollback","amp:agent:suspend","amp:monitor:read","amp:monitor:score-read","amp:observability:log-read","amp:observability:build-log-read","amp:observability:metric-read","amp:catalog:read","amp:profile:read","amp:profile:update-attributes"]'

    log_info "Default role provisioning complete (4 roles created/updated)."

    # ===========================================================================
    # Assign default users to roles
    # ===========================================================================
    assign_user_to_role() {
      local username="$1" role_id="$2" role_name="$3"
      local response http_code body user_id

      response=$(api_call GET "/users")
      http_code="${response: -3}"
      body="${response%???}"
      if [[ "$http_code" != "200" ]]; then
        log_error "Failed to fetch users (HTTP $http_code)"
        exit 1
      fi

      user_id=$(echo "$body" | sed 's/},{/}\n{/g' | grep "\"username\":\"${username}\"" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
      if [[ -z "$user_id" ]]; then
        log_warning "User '${username}' not found, skipping role assignment"
        return 0
      fi

      local payload="{\"assignments\":[{\"id\":\"${user_id}\",\"type\":\"user\"}]}"
      response=$(api_call POST "/roles/${role_id}/assignments/add" "$payload")
      http_code="${response: -3}"
      if [[ "$http_code" == "200" ]] || [[ "$http_code" == "201" ]] || [[ "$http_code" == "204" ]] || [[ "$http_code" == "409" ]]; then
        log_success "Assigned user '${username}' to role '${role_name}'"
      else
        log_error "Failed to assign user '${username}' to role '${role_name}' (HTTP $http_code): ${response%???}"
        exit 1
      fi
    }

    assign_user_to_role "{{ .Values.thunder.setup.admin.username }}" "$ADMIN_ID" "admin"

    # ===========================================================================
    # Assign ampApiClient app to Agent Manager Admin role so it gets all scopes in M2M tokens
    # ===========================================================================
    log_info "Assigning ampApiClient app to admin role..."
    response=$(api_call GET "/applications")
    http_code="${response: -3}"
    body="${response%???}"
    if [[ "$http_code" != "200" ]]; then
      log_error "Failed to fetch applications (HTTP $http_code)"
      exit 1
    fi

    AMP_API_CLIENT_ID=$(echo "$body" | sed 's/},{/}\n{/g' | grep '"clientId":"amp-api-client"' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    if [[ -z "$AMP_API_CLIENT_ID" ]]; then
      log_warning "ampApiClient app not found, skipping role assignment"
    else
      payload="{\"assignments\":[{\"id\":\"${AMP_API_CLIENT_ID}\",\"type\":\"app\"}]}"
      response=$(api_call POST "/roles/${ADMIN_ID}/assignments/add" "$payload")
      http_code="${response: -3}"
      if [[ "$http_code" == "200" ]] || [[ "$http_code" == "201" ]] || [[ "$http_code" == "204" ]] || [[ "$http_code" == "409" ]]; then
        log_success "Assigned ampApiClient to Agent Manager Admin role"
      else
        log_error "Failed to assign ampApiClient to Agent Manager Admin role (HTTP $http_code): ${response%???}"
        exit 1
      fi
    fi

    log_info "Default role assignments complete."

  62-amp-default-groups.sh: |
    #!/bin/bash
    set -e

    SCRIPT_DIR="$(dirname "${BASH_SOURCE[0]:-$0}")"
    source "${SCRIPT_DIR}/common.sh"

    log_info "Creating AMP default groups..."

    # ---------------------------------------------------------------------------
    # Fetch default OU ID
    # ---------------------------------------------------------------------------
    RESPONSE=$(api_call GET "/organization-units/tree/default")
    HTTP_CODE="${RESPONSE: -3}"
    BODY="${RESPONSE%???}"
    if [[ "$HTTP_CODE" != "200" ]]; then
      log_error "Failed to fetch default OU (HTTP $HTTP_CODE)"
      exit 1
    fi
    DEFAULT_OU_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    if [[ -z "$DEFAULT_OU_ID" ]]; then
      log_error "Could not extract default OU ID"
      exit 1
    fi
    log_info "Using OU ID: $DEFAULT_OU_ID"

    # ---------------------------------------------------------------------------
    # Helper: create or get group by name; echoes the group ID
    # ---------------------------------------------------------------------------
    create_or_get_group() {
      local name="$1" description="$2"
      local payload="{\"name\":\"${name}\",\"ouId\":\"${DEFAULT_OU_ID}\",\"description\":\"${description}\"}"
      local response http_code body id

      response=$(api_call POST "/groups" "$payload")
      http_code="${response: -3}"
      body="${response%???}"

      if [[ "$http_code" == "201" ]] || [[ "$http_code" == "200" ]]; then
        id=$(echo "$body" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
        log_success "Created group '${name}' (id: $id)" >&2
        echo "$id"
        return 0
      fi

      if [[ "$http_code" == "409" ]]; then
        log_warning "Group '${name}' already exists, retrieving ID..." >&2
        response=$(api_call GET "/groups")
        body="${response%???}"
        id=$(echo "$body" | sed 's/},{/}\n{/g' | grep "\"name\":\"${name}\"" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
        if [[ -z "$id" ]]; then
          log_error "Group '${name}' reported 409 but not found in list" >&2
          exit 1
        fi
        log_success "Found existing group '${name}' (id: $id)" >&2
        echo "$id"
        return 0
      fi

      log_error "Failed to create group '${name}' (HTTP $http_code): $body" >&2
      exit 1
    }

    # ===========================================================================
    # Create default groups
    # ===========================================================================
    ADMINS_GROUP_ID=$(create_or_get_group "Agent Manager Admins" "Administrative group with full access to all AMP resources")

    # ===========================================================================
    # Assign Agent Manager Admin role to Agent Manager Admins group
    # ===========================================================================
    log_info "Looking up admin role..."
    RESPONSE=$(api_call GET "/roles")
    HTTP_CODE="${RESPONSE: -3}"
    BODY="${RESPONSE%???}"
    if [[ "$HTTP_CODE" != "200" ]]; then
      log_error "Failed to fetch roles (HTTP $HTTP_CODE)"
      exit 1
    fi

    ADMIN_ROLE_ID=$(echo "$BODY" | sed 's/},{/}\n{/g' | grep '"name":"admin"' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    if [[ -z "$ADMIN_ROLE_ID" ]]; then
      log_error "Could not find 'admin' role"
      exit 1
    fi
    log_info "Found 'admin' role (id: $ADMIN_ROLE_ID)"

    log_info "Assigning Agent Manager Admin role to Agent Manager Admins group..."
    ASSIGN_PAYLOAD='{"assignments":[{"id":"'${ADMINS_GROUP_ID}'","type":"group"}]}'
    RESPONSE=$(api_call POST "/roles/$ADMIN_ROLE_ID/assignments/add" "$ASSIGN_PAYLOAD")
    HTTP_CODE="${RESPONSE: -3}"
    if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "201" ]] || [[ "$HTTP_CODE" == "204" ]] || [[ "$HTTP_CODE" == "409" ]]; then
      log_success "Assigned Agent Manager Admin role to Agent Manager Admins group"
    else
      log_error "Failed to assign Agent Manager Admin role to Agent Manager Admins group (HTTP $HTTP_CODE)"
      echo "Response: ${RESPONSE%???}"
      exit 1
    fi

    # ===========================================================================
    # Assign admin user to Agent Manager Admins group
    # ===========================================================================
    log_info "Looking up admin user..."
    RESPONSE=$(api_call GET "/users")
    HTTP_CODE="${RESPONSE: -3}"
    BODY="${RESPONSE%???}"
    if [[ "$HTTP_CODE" != "200" ]]; then
      log_error "Failed to fetch users (HTTP $HTTP_CODE)"
      exit 1
    fi

    ADMIN_USER_ID=$(echo "$BODY" | sed 's/},{/}\n{/g' | grep '"username":"{{ .Values.thunder.setup.admin.username }}"' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
    if [[ -z "$ADMIN_USER_ID" ]]; then
      log_warning "admin user not found, skipping group assignment"
    else
      log_info "Found admin user (id: $ADMIN_USER_ID)"
      log_info "Assigning admin user to Agent Manager Admins group..."
      ASSIGN_USER_PAYLOAD='{"members":[{"id":"'${ADMIN_USER_ID}'","type":"user"}]}'
      RESPONSE=$(api_call POST "/groups/$ADMINS_GROUP_ID/members/add" "$ASSIGN_USER_PAYLOAD")
      HTTP_CODE="${RESPONSE: -3}"
      if [[ "$HTTP_CODE" == "200" ]] || [[ "$HTTP_CODE" == "201" ]] || [[ "$HTTP_CODE" == "204" ]] || [[ "$HTTP_CODE" == "409" ]]; then
        log_success "Assigned admin user to Agent Manager Admins group"
      else
        log_error "Failed to assign admin user to Agent Manager Admins group (HTTP $HTTP_CODE)"
        echo "Response: ${RESPONSE%???}"
        exit 1
      fi
    fi

    log_info "Default group provisioning complete (1 group created/updated)."
