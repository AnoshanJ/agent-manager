<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O2 Insurance — Support</title>
<style>
  :root {
    --brand: #10396b;
    --brand-hi: #17548f;
    --accent: #16a97b;
    --brand-soft: #e9f0f8;
    --bg: #f2f5f9;
    --surface: #ffffff;
    --border: #e0e6ef;
    --text: #17202f;
    --muted: #67718a;
    --bubble: #eef1f6;
    --danger: #b42318;
    --ok: #12855f;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --brand: #4b8ede;
      --brand-hi: #6ba3e8;
      --accent: #2bc493;
      --brand-soft: #16233a;
      --bg: #0a0f18;
      --surface: #111926;
      --border: #212c40;
      --text: #e7ebf3;
      --muted: #96a0b5;
      --bubble: #1a2333;
      --danger: #ff8a80;
      --ok: #35c795;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  .app {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    max-width: 1080px;
    margin: 0 auto;
    background: var(--surface);
    border-inline: 1px solid var(--border);
  }
  @media (max-width: 1080px) { .app { border-inline: none; } }

  /* ---------- brand ---------- */
  .mark {
    width: 34px; height: 34px; flex: none; border-radius: 9px;
    background: linear-gradient(160deg, var(--brand-hi) 0%, var(--brand) 100%);
    display: grid; place-items: center;
  }
  .mark svg { width: 19px; height: 19px; fill: #fff; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .wordmark { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .wordmark span { color: var(--muted); font-weight: 500; }
  .tagline { font-size: 11.5px; color: var(--muted); }
  .topbar .spacer { flex: 1; }
  .who { text-align: right; line-height: 1.25; min-width: 0; }
  .who .name { font-size: 13px; font-weight: 600; }
  .who .sub { font-size: 11.5px; color: var(--muted); }

  /* ---------- assurance strip ---------- */
  .strip {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 8px 20px; background: var(--brand-soft);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px; color: var(--muted);
  }
  .strip b { color: var(--text); font-weight: 600; }
  .strip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }

  button {
    font: inherit; font-size: 13px;
    border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    padding: 8px 13px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: var(--bubble); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { filter: brightness(1.12); background: var(--brand); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- thread ---------- */
  .thread { overflow-y: auto; padding: 22px 20px 8px; scroll-behavior: smooth; }
  .inner { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 28px; height: 28px; flex: none; border-radius: 8px;
    display: grid; place-items: center; font-size: 10.5px; font-weight: 700;
  }
  .avatar.bot { background: linear-gradient(160deg, var(--brand-hi) 0%, var(--brand) 100%); }
  .avatar.bot svg { width: 15px; height: 15px; fill: #fff; }
  .avatar.me { background: var(--brand-soft); color: var(--brand); }

  .msg {
    padding: 11px 15px; border-radius: var(--radius); font-size: 14.5px;
    line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 76%;
  }
  .row.user .msg { background: var(--brand); color: #fff; border-bottom-right-radius: 5px; }
  .row.bot .msg { background: var(--bubble); border-bottom-left-radius: 5px; }
  .row.error .msg { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: var(--muted); animation: blink 1.3s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

  /* ---------- empty state ---------- */
  .welcome { text-align: center; padding: 5vh 0 0; }
  .welcome .bigmark {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 15px;
    background: linear-gradient(160deg, var(--brand-hi) 0%, var(--brand) 100%);
    display: grid; place-items: center;
  }
  .welcome .bigmark svg { width: 30px; height: 30px; fill: #fff; }
  .welcome h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .welcome p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .suggestions {
    margin: 22px auto 0; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); max-width: 620px;
  }
  .chip {
    text-align: left; padding: 13px 15px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer;
    transition: border-color .15s, transform .1s, background .15s;
  }
  .chip:hover { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-1px); }
  .chip .q { font-size: 13.5px; font-weight: 600; }
  .chip .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---------- composer ---------- */
  .composer { border-top: 1px solid var(--border); padding: 14px 20px 16px; }
  .composer form { max-width: 740px; margin: 0 auto; display: flex; gap: 10px; }
  .composer input {
    flex: 1; font: inherit; font-size: 14.5px; padding: 12px 15px;
    border: 1px solid var(--border); border-radius: 11px;
    background: var(--bg); color: var(--text);
  }
  .composer input:focus { outline: 2px solid var(--brand); outline-offset: -1px; background: var(--surface); }
  .footnote { max-width: 740px; margin: 9px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }

  /* ---------- login ---------- */
  .login-screen { height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 400px; text-align: center; padding: 44px 34px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  }
  .login-card .bigmark {
    width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 15px;
    background: linear-gradient(160deg, var(--brand-hi) 0%, var(--brand) 100%);
    display: grid; place-items: center;
  }
  .login-card .bigmark svg { width: 30px; height: 30px; fill: #fff; }
  .login-card h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .login-card p { color: var(--muted); font-size: 14px; margin: 8px 0 26px; }
  .login-card button { width: 100%; padding: 12px; font-size: 14.5px; }
  .login-err { margin-top: 18px; color: var(--danger); font-size: 13px; }

  @media (max-width: 560px) {
    .msg { max-width: 88%; }
    .thread { padding: 16px 14px 4px; }
    .composer { padding: 12px 14px 14px; }
    .tagline, .who .sub, .strip .hide-sm { display: none; }
  }
</style>
</head>
<body>

<div id="login-view" class="login-screen hidden">
  <div class="login-card">
    <div class="bigmark"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.05 3.84 9.77 9 11 5.16-1.23 9-5.95 9-11V5l-9-4zm-1.2 15.3-3.5-3.5 1.4-1.4 2.1 2.1 5-5 1.4 1.4-6.4 6.4z"/></svg></div>
    <h1 id="login-title">O2 Insurance Support</h1>
    <p>Sign in to view your policies and claims.</p>
    <button type="button" class="primary" id="login-btn">Sign in</button>
    <div class="login-err" id="login-error"></div>
  </div>
</div>

<div id="app-view" class="app hidden">
  <div class="topbar">
    <div class="logo">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.05 3.84 9.77 9 11 5.16-1.23 9-5.95 9-11V5l-9-4zm-1.2 15.3-3.5-3.5 1.4-1.4 2.1 2.1 5-5 1.4 1.4-6.4 6.4z"/></svg></div>
      <div>
        <div class="wordmark" id="brand-name">O2 Insurance <span>Support</span></div>
        <div class="tagline">Policies, claims and cover</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="who">
      <div class="name" id="greeting">Hello</div>
      <div class="sub" id="subtitle"></div>
    </div>
    <button type="button" id="new-chat">New chat</button>
    <button type="button" id="logout" class="hidden">Sign out</button>
  </div>

  <div class="strip">
    <span><span class="dot"></span> Adviser online</span>
    <span class="hide-sm">Claims line <b>0800 111 222</b></span>
    <span class="hide-sm">Mon-Sat, 8am-8pm</span>
    <span class="hide-sm">Ref <b id="ref-code">—</b></span>
  </div>

  <div class="thread" id="thread">
    <div class="inner" id="transcript"></div>
  </div>

  <div class="composer">
    <form id="composer">
      <input type="text" id="message" placeholder="Ask about a policy, a claim or what you're covered for..." autocomplete="off">
      <button class="primary" id="send" type="submit">Send</button>
    </form>
    <div class="footnote">Demo data only. This agent cannot approve claims, change a premium or take payment.</div>
  </div>
</div>

<script src="/config.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const AUTH_ENABLED = Boolean(CFG.clientId && CFG.issuer);
const REDIRECT_URI = window.location.origin + '/';
const COMPANY = CFG.companyName || 'O2 Insurance';

const SHIELD = '<svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.05 3.84 9.77 9 11 5.16-1.23 9-5.95 9-11V5l-9-4zm-1.2 15.3-3.5-3.5 1.4-1.4 2.1 2.1 5-5 1.4 1.4-6.4 6.4z"/></svg>';

const SUGGESTIONS = [
  { q: 'What can you do?', hint: 'See everything this adviser handles' },
  { q: 'What policies do I have?', hint: 'Cover, premiums and renewal dates' },
  { q: 'What is happening with my claims?', hint: 'Status and next steps' },
  { q: 'What am I covered for on OZ-AUTO-4417?', hint: 'Full cover on one policy' },
];

const els = {
  loginView: document.getElementById('login-view'),
  loginBtn: document.getElementById('login-btn'),
  loginError: document.getElementById('login-error'),
  loginTitle: document.getElementById('login-title'),
  appView: document.getElementById('app-view'),
  brandName: document.getElementById('brand-name'),
  refCode: document.getElementById('ref-code'),
  greeting: document.getElementById('greeting'),
  subtitle: document.getElementById('subtitle'),
  thread: document.getElementById('thread'),
  transcript: document.getElementById('transcript'),
  composer: document.getElementById('composer'),
  message: document.getElementById('message'),
  send: document.getElementById('send'),
  newChat: document.getElementById('new-chat'),
  logout: document.getElementById('logout'),
};

let accessToken = null;
let sessionId = crypto.randomUUID();
let metadata = null;

// --- OIDC discovery + PKCE ---------------------------------------------------

async function discover() {
  if (metadata) return metadata;
  const res = await fetch(CFG.issuer + '/.well-known/openid-configuration');
  if (!res.ok) throw new Error('OIDC discovery failed (' + res.status + ') at ' + CFG.issuer);
  metadata = await res.json();
  return metadata;
}

function base64url(bytes) {
  let str = '';
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function randomString() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64url(bytes);
}

async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return base64url(new Uint8Array(digest));
}

async function login() {
  const meta = await discover();
  const verifier = randomString();
  const state = randomString();
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);

  const url = new URL(meta.authorization_endpoint);
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('client_id', CFG.clientId);
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('scope', CFG.scopes);
  url.searchParams.set('state', state);
  url.searchParams.set('code_challenge', await challengeFor(verifier));
  url.searchParams.set('code_challenge_method', 'S256');
  window.location.assign(url.toString());
}

async function completeLogin(code, state) {
  if (state !== sessionStorage.getItem('oauth_state')) {
    throw new Error('State mismatch — possible CSRF, login aborted.');
  }
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) throw new Error('Missing PKCE verifier — start the login again.');

  const meta = await discover();
  const res = await fetch(meta.token_endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      client_id: CFG.clientId,
      code_verifier: verifier,
    }),
  });
  if (!res.ok) throw new Error('Token exchange failed (' + res.status + '): ' + await res.text());

  const tokens = await res.json();
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('oauth_state');
  window.history.replaceState({}, '', REDIRECT_URI);
  return tokens;
}

function claimsFrom(idToken) {
  if (!idToken) return {};
  try {
    const payload = idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(payload))));
  } catch (e) {
    return {};
  }
}

async function logout() {
  accessToken = null;
  sessionStorage.clear();
  try {
    const meta = await discover();
    if (meta.end_session_endpoint) {
      const url = new URL(meta.end_session_endpoint);
      url.searchParams.set('post_logout_redirect_uri', REDIRECT_URI);
      url.searchParams.set('client_id', CFG.clientId);
      window.location.assign(url.toString());
      return;
    }
  } catch (e) { /* fall through to a local sign-out */ }
  window.location.assign(REDIRECT_URI);
}

// --- chat --------------------------------------------------------------------

function scrollDown() {
  els.thread.scrollTop = els.thread.scrollHeight;
}

function addRow(kind, node) {
  const row = document.createElement('div');
  row.className = 'row ' + kind;

  const avatar = document.createElement('div');
  if (kind === 'user') {
    avatar.className = 'avatar me';
    avatar.textContent = 'You';
  } else {
    avatar.className = 'avatar bot';
    avatar.innerHTML = SHIELD;
  }

  const msg = document.createElement('div');
  msg.className = 'msg';
  if (typeof node === 'string') msg.textContent = node;
  else msg.appendChild(node);

  row.append(avatar, msg);
  els.transcript.appendChild(row);
  scrollDown();
  return msg;
}

function typingIndicator() {
  const dots = document.createElement('div');
  dots.className = 'dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  return dots;
}

function showWelcome() {
  els.transcript.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'welcome';
  wrap.innerHTML =
    '<div class="bigmark">' + SHIELD + '</div>' +
    '<h2>How can we help today?</h2>' +
    '<p>Ask about your cover, check a claim, or start a new one.</p>';

  const grid = document.createElement('div');
  grid.className = 'suggestions';
  for (const s of SUGGESTIONS) {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = s.q;
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = s.hint;
    chip.append(q, hint);
    chip.addEventListener('click', () => send(s.q));
    grid.appendChild(chip);
  }
  wrap.appendChild(grid);
  els.transcript.appendChild(wrap);
}

function resetTranscript() {
  sessionId = crypto.randomUUID();
  els.refCode.textContent = sessionId.slice(0, 8).toUpperCase();
  showWelcome();
  els.message.focus();
}

async function send(text) {
  const welcome = els.transcript.querySelector('.welcome');
  if (welcome) welcome.remove();

  addRow('user', text);
  const pending = addRow('bot', typingIndicator());
  els.send.disabled = true;

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

    const res = await fetch(CFG.agentUrl, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    if (res.status === 401 || res.status === 403) {
      pending.parentElement.className = 'row error';
      pending.textContent = 'The agent rejected the token (' + res.status + '). Sign in again.';
      return;
    }
    if (!res.ok) {
      pending.parentElement.className = 'row error';
      pending.textContent = 'Agent error ' + res.status + ': ' + await res.text();
      return;
    }

    const data = await res.json();
    if (data.session_id) sessionId = data.session_id;
    pending.textContent = (data.response || '').trim();
  } catch (err) {
    pending.parentElement.className = 'row error';
    pending.textContent = 'Could not reach the agent: ' + err.message;
  } finally {
    els.send.disabled = false;
    els.message.focus();
    scrollDown();
  }
}

// --- wiring ------------------------------------------------------------------

function showChat(claims) {
  const name = claims.given_name || claims.name || claims.preferred_username || claims.email;
  els.brandName.innerHTML = COMPANY + ' <span>Support</span>';
  els.greeting.textContent = name ? 'Hello, ' + name : 'Hello';
  els.subtitle.textContent = AUTH_ENABLED ? 'Signed in' : 'No login configured';
  els.logout.classList.toggle('hidden', !AUTH_ENABLED);
  els.loginView.classList.add('hidden');
  els.appView.classList.remove('hidden');
  resetTranscript();
}

function showLogin(error) {
  els.loginTitle.textContent = COMPANY + ' Support';
  els.loginError.textContent = error || '';
  els.appView.classList.add('hidden');
  els.loginView.classList.remove('hidden');
}

els.loginBtn.addEventListener('click', () => {
  els.loginError.textContent = '';
  login().catch((err) => { els.loginError.textContent = err.message; });
});
els.logout.addEventListener('click', () => { logout(); });
els.newChat.addEventListener('click', resetTranscript);
els.composer.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = els.message.value.trim();
  if (!text) return;
  els.message.value = '';
  send(text);
});

(async function start() {
  document.title = COMPANY + ' — Support';

  if (!AUTH_ENABLED) {
    showChat({});
    return;
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    showLogin(params.get('error_description') || params.get('error'));
    return;
  }

  const code = params.get('code');
  if (!code) {
    showLogin();
    return;
  }

  try {
    const tokens = await completeLogin(code, params.get('state'));
    accessToken = tokens.access_token;
    showChat(claimsFrom(tokens.id_token));
  } catch (err) {
    showLogin(err.message);
  }
})();
</script>
</body>
</html>
