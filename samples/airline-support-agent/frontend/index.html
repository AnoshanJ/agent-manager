<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airline Support</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1b1f27;
    --muted: #666e7d;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --agent-bubble: #eef1f5;
    --danger: #b42318;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 720px;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  .login {
    padding: 56px 40px;
    text-align: center;
  }
  .login h1 { font-size: 22px; margin-bottom: 8px; }
  .login p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header .who { flex: 1; min-width: 0; }
  header .greeting { font-size: 15px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }

  button {
    font: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { background: var(--bg); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    padding: 10px 22px;
  }
  button.primary:hover { opacity: 0.92; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #transcript {
    height: 420px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); }
  .msg.agent { align-self: flex-start; background: var(--agent-bubble); }
  .msg.error { align-self: flex-start; background: #fdecea; color: var(--danger); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; margin: auto; }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  input[type=text] {
    flex: 1;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
</head>
<body>

<div class="card">
  <div id="login-view" class="login hidden">
    <h1 id="login-title">Airline Support</h1>
    <p>Sign in to chat with the support agent.</p>
    <button class="primary" id="login-btn">Sign in</button>
    <p id="login-error" style="margin-top:20px;color:var(--danger)"></p>
  </div>

  <div id="app-view" class="hidden">
    <header>
      <div class="who">
        <div class="greeting" id="greeting">Hello</div>
        <div class="sub" id="subtitle"></div>
      </div>
      <button id="new-chat">New chat</button>
      <button id="logout" class="hidden">Sign out</button>
    </header>
    <div id="transcript"></div>
    <form id="composer">
      <input type="text" id="message" placeholder="Ask about a booking, flight or seat..." autocomplete="off">
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </div>
</div>

<script src="/config.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const AUTH_ENABLED = Boolean(CFG.clientId && CFG.issuer);
const REDIRECT_URI = window.location.origin + '/';

const els = {
  loginView: document.getElementById('login-view'),
  loginBtn: document.getElementById('login-btn'),
  loginError: document.getElementById('login-error'),
  loginTitle: document.getElementById('login-title'),
  appView: document.getElementById('app-view'),
  greeting: document.getElementById('greeting'),
  subtitle: document.getElementById('subtitle'),
  transcript: document.getElementById('transcript'),
  composer: document.getElementById('composer'),
  message: document.getElementById('message'),
  send: document.getElementById('send'),
  newChat: document.getElementById('new-chat'),
  logout: document.getElementById('logout'),
};

let accessToken = null;
let sessionId = crypto.randomUUID();
let metadata = null;

// --- OIDC discovery + PKCE ---------------------------------------------------

async function discover() {
  if (metadata) return metadata;
  const res = await fetch(CFG.issuer + '/.well-known/openid-configuration');
  if (!res.ok) throw new Error('OIDC discovery failed (' + res.status + ') at ' + CFG.issuer);
  metadata = await res.json();
  return metadata;
}

function randomString() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64url(bytes);
}

function base64url(bytes) {
  let str = '';
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return base64url(new Uint8Array(digest));
}

async function login() {
  const meta = await discover();
  const verifier = randomString();
  const state = randomString();
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oauth_state', state);

  const url = new URL(meta.authorization_endpoint);
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('client_id', CFG.clientId);
  url.searchParams.set('redirect_uri', REDIRECT_URI);
  url.searchParams.set('scope', CFG.scopes);
  url.searchParams.set('state', state);
  url.searchParams.set('code_challenge', await challengeFor(verifier));
  url.searchParams.set('code_challenge_method', 'S256');
  window.location.assign(url.toString());
}

async function completeLogin(code, state) {
  if (state !== sessionStorage.getItem('oauth_state')) {
    throw new Error('State mismatch — possible CSRF, login aborted.');
  }
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) throw new Error('Missing PKCE verifier — start the login again.');

  const meta = await discover();
  const res = await fetch(meta.token_endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      client_id: CFG.clientId,
      code_verifier: verifier,
    }),
  });
  if (!res.ok) throw new Error('Token exchange failed (' + res.status + '): ' + await res.text());

  const tokens = await res.json();
  sessionStorage.removeItem('pkce_verifier');
  sessionStorage.removeItem('oauth_state');
  window.history.replaceState({}, '', REDIRECT_URI);
  return tokens;
}

function claimsFrom(idToken) {
  if (!idToken) return {};
  try {
    const payload = idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(payload))));
  } catch (e) {
    return {};
  }
}

async function logout() {
  const token = accessToken;
  accessToken = null;
  sessionStorage.clear();
  try {
    const meta = await discover();
    if (meta.end_session_endpoint) {
      const url = new URL(meta.end_session_endpoint);
      url.searchParams.set('post_logout_redirect_uri', REDIRECT_URI);
      url.searchParams.set('client_id', CFG.clientId);
      window.location.assign(url.toString());
      return;
    }
  } catch (e) { /* fall through to a local sign-out */ }
  void token;
  window.location.assign(REDIRECT_URI);
}

// --- chat --------------------------------------------------------------------

function bubble(text, kind) {
  const empty = els.transcript.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + kind;
  div.textContent = text;
  els.transcript.appendChild(div);
  els.transcript.scrollTop = els.transcript.scrollHeight;
  return div;
}

function resetTranscript() {
  sessionId = crypto.randomUUID();
  els.transcript.innerHTML = '<div class="empty">New conversation. Try: "What is the status of SK412?"</div>';
}

async function send(text) {
  bubble(text, 'user');
  const pending = bubble('...', 'agent');
  els.send.disabled = true;

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;

    const res = await fetch(CFG.agentUrl, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    if (res.status === 401 || res.status === 403) {
      pending.remove();
      bubble('The agent rejected the token (' + res.status + '). Sign in again.', 'error');
      return;
    }
    if (!res.ok) {
      pending.remove();
      bubble('Agent error ' + res.status + ': ' + await res.text(), 'error');
      return;
    }

    const data = await res.json();
    if (data.session_id) sessionId = data.session_id;
    pending.textContent = data.response;
  } catch (err) {
    pending.remove();
    bubble('Could not reach the agent: ' + err.message, 'error');
  } finally {
    els.send.disabled = false;
    els.message.focus();
  }
}

// --- wiring ------------------------------------------------------------------

function showChat(claims) {
  const name = claims.given_name || claims.name || claims.preferred_username || claims.email;
  els.greeting.textContent = name ? 'Hello, ' + name : 'Hello';
  els.subtitle.textContent = CFG.airlineName + (AUTH_ENABLED ? '' : ' — no login configured');
  els.logout.classList.toggle('hidden', !AUTH_ENABLED);
  els.loginView.classList.add('hidden');
  els.appView.classList.remove('hidden');
  resetTranscript();
  els.message.focus();
}

function showLogin(error) {
  els.loginTitle.textContent = CFG.airlineName + ' Support';
  els.loginError.textContent = error || '';
  els.appView.classList.add('hidden');
  els.loginView.classList.remove('hidden');
}

els.loginBtn.addEventListener('click', () => {
  els.loginError.textContent = '';
  login().catch((err) => { els.loginError.textContent = err.message; });
});
els.logout.addEventListener('click', () => { logout(); });
els.newChat.addEventListener('click', resetTranscript);
els.composer.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = els.message.value.trim();
  if (!text) return;
  els.message.value = '';
  send(text);
});

(async function start() {
  if (!AUTH_ENABLED) {
    showChat({});
    return;
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    showLogin(params.get('error_description') || params.get('error'));
    return;
  }

  const code = params.get('code');
  if (!code) {
    showLogin();
    return;
  }

  try {
    const tokens = await completeLogin(code, params.get('state'));
    accessToken = tokens.access_token;
    showChat(claimsFrom(tokens.id_token));
  } catch (err) {
    showLogin(err.message);
  }
})();
</script>
</body>
</html>
